<style>
  :root{--bg:#f7f7f4;--panel:#fff;--ink:#161616;--muted:#6b6f76;--hair:#e6e6e1;--accent:#139d13;--chip:#eef4ee;}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121311;--panel:#1b1c1a;--ink:#f1f1ec;--muted:#a0a49b;--hair:#2b2d29;--accent:#7bbf6f;--chip:#1f271d;}}
  :root[data-theme=dark]{color-scheme:dark;--bg:#121311;--panel:#1b1c1a;--ink:#f1f1ec;--muted:#a0a49b;--hair:#2b2d29;--accent:#7bbf6f;--chip:#1f271d;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:34px clamp(16px,4vw,48px) 12px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font-size:clamp(26px,4vw,40px);margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .grid{display:grid;gap:18px;padding:18px clamp(16px,4vw,48px) 56px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{margin:0;background:var(--panel);border:1px solid var(--hair);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    cursor:zoom-in;transition:transform .12s ease,box-shadow .12s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .frame{background:#000;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .frame video{width:100%;height:100%;object-fit:contain;display:block}
  figcaption{padding:11px 13px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .t{font-size:14.5px;font-weight:600} .tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
    background:var(--chip);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .diagram{padding:6px clamp(16px,4vw,48px) 4px;text-align:center}
  .dhead{font-size:clamp(20px,3vw,30px);font-weight:600;margin:0 0 8px;color:var(--ink);text-align:left}
  .diagram svg text{font-family:inherit}
  .stitle{fill:#0f2410;text-anchor:middle;font-size:19px}
  .ssub{fill:#14361b;text-anchor:middle;font-size:14.5px}
  .htitle{fill:#fff;text-anchor:middle;font-size:25px;font-weight:700}
  .hsub{fill:#eafff0;text-anchor:middle;font-size:16px;font-weight:700}
  .dlab{fill:var(--ink);text-anchor:start;font-size:19px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;padding:12px;z-index:50;cursor:zoom-out}
  .lb.open{display:flex}
  .lb video{width:68vw;height:62vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
  .lb .cap{color:#fff;font-size:16px;font-weight:600;text-align:center}
  .lb .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;color:#fff;background:rgba(255,255,255,.12);
    border:0;width:40px;height:40px;border-radius:999px;font-size:22px;line-height:1;cursor:pointer}
  .lb .close:hover{background:rgba(255,255,255,.24)} .lb .hint{color:rgba(255,255,255,.6);font-size:12px}
  @media (max-width:640px){.lb video{width:96vw;height:70vh}}
</style>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged clip">
  <button class="close" id="lbClose" aria-label="Close">&times;</button>
  <video id="lbVid" muted loop playsinline controls></video>
  <div class="cap" id="lbCap"></div>
  <div class="hint">Click outside or press Esc to close</div>
</div>
<script>
  (function(){
    var lb=document.getElementById('lb'), vid=document.getElementById('lbVid'),
        cap=document.getElementById('lbCap'), grid=document.getElementById('grid');
    // play only videos in view, pause the rest -> stays smooth with many clips
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ var v=e.target.querySelector('video'); if(!v) return;
        if(e.isIntersecting){ v.play().catch(function(){}); } else { v.pause(); } });
    }, {rootMargin:'200px'});
    document.querySelectorAll('.card').forEach(function(c){ io.observe(c); });
    function open(card){ vid.src=card.getAttribute('data-src'); cap.textContent=card.getAttribute('data-title');
      lb.classList.add('open'); document.body.style.overflow='hidden'; vid.play().catch(function(){}); }
    function close(){ lb.classList.remove('open'); vid.pause(); vid.removeAttribute('src'); vid.load(); document.body.style.overflow=''; }
    grid.addEventListener('click', function(e){ var c=e.target.closest('.card'); if(c) open(c); });
    grid.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){ e.preventDefault(); open(e.target); } });
    lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
    document.getElementById('lbClose').addEventListener('click', function(e){ e.stopPropagation(); close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  })();
</script>
